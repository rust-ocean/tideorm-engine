name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # `cargo publish` builds the default features, which pick no backend.
      - name: Run clippy without a backend
        run: cargo clippy --locked -- -D warnings

  # `rust-version` is a promise to downstream resolvers that no other job checks.
  # Keep this literal in sync with `rust-version` in Cargo.toml.
  msrv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@dc08e2af391d489dff6d14cf743e574f7d1229c5 # 1.94.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check against the declared MSRV
        run: cargo check --locked --all-features

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run engine contracts with both runtimes
        run: cargo test --locked --all-features --tests

  # The `live::` query and mutation contracts against a real server; `sqlite`
  # keeps the contracts from being ignored.
  live-postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    env:
      ENGINE_PROBE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_tide_orm

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_tide_orm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run engine query and mutation contracts
        run: cargo test --locked --no-default-features --features sqlite,postgres,runtime-tokio --tests 'live::'

  live-mysql:
    runs-on: ubuntu-latest
    env:
      ENGINE_PROBE_DATABASE_URL: mysql://root@127.0.0.1:3306/test_tide_orm

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: test_tide_orm
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run engine query and mutation contracts
        run: cargo test --locked --no-default-features --features sqlite,mysql,runtime-tokio --tests 'live::'

  # The oldest and newest supported MariaDB LTS lines.
  live-mariadb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mariadb: ["10.11", "12.3"]
    env:
      ENGINE_PROBE_DATABASE_URL: mysql://root@127.0.0.1:3306/test_tide_orm

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: test_tide_orm
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run engine query and mutation contracts
        run: cargo test --locked --no-default-features --features sqlite,mysql,runtime-tokio --tests 'live::'

  # Servers speaking PostgreSQL's or MySQL's protocol run that family's
  # contracts. They start with `docker run`, since a service container takes no
  # command; the images and options are tideorm's `integration-compatible` ones.
  live-compatible:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: CockroachDB
            feature: postgres
            url: postgresql://root@127.0.0.1:26257/defaultdb
            start: >-
              docker run -d --name db -p 127.0.0.1:26257:26257
              cockroachdb/cockroach:v26.4.0 start-single-node --insecure
            ready: docker exec db ./cockroach sql --insecure -e "SELECT 1"
          - server: YugabyteDB
            feature: postgres
            url: postgresql://yugabyte@127.0.0.1:5433/yugabyte
            start: >-
              docker run -d --name db -p 127.0.0.1:5433:5433
              yugabytedb/yugabyte:2025.2.8.1-b8 bin/yugabyted start --background=false
              --tserver_flags=ysql_sequence_cache_minval=1
            ready: docker exec db bash -c 'bin/ysqlsh -h "$(hostname)" -U yugabyte -c "SELECT 1"'
          - server: TiDB
            feature: mysql
            url: mysql://root@127.0.0.1:4000/test
            start: docker run -d --name db -p 127.0.0.1:4000:4000 pingcap/tidb:v8.5.8
            ready: mysql --protocol=tcp -h127.0.0.1 -P4000 -uroot -e "SELECT 1"
          - server: Vitess
            feature: mysql
            url: mysql://root@127.0.0.1:33577/tideorm_test
            # The keyspace is the database; its setup script exits 1 for one keyspace.
            start: >-
              docker run -d --name db -p 127.0.0.1:33577:33577 -e KEYSPACES=tideorm_test -e NUM_SHARDS=1
              vitess/vttestserver:v24.0.5-mysql80 /bin/bash -c '/vt/setup_vschema_folder.sh "$KEYSPACES" "$NUM_SHARDS";
              echo "max_connections = 1000" >> /vt/config/mycnf/test-suite.cnf &&
              exec /vt/bin/vttestserver --port 33574 --keyspaces "$KEYSPACES" --num_shards "$NUM_SHARDS"
              --mysql_bind_host 0.0.0.0 --mysql-server-version 8.0.43-Vitess --charset utf8mb4
              --foreign_key_mode allow --enable_online_ddl=true --enable_direct_ddl=true --planner-version=gen4
              --vschema_ddl_authorized_users=% --tablet_refresh_interval 10s --schema_dir=/vt/schema/
              --queryserver-config-transaction-timeout 300s'
            ready: mysql --protocol=tcp -h127.0.0.1 -P33577 -uroot tideorm_test -e "SELECT 1"

    name: live-compatible (${{ matrix.server }})
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start ${{ matrix.server }}
        run: ${{ matrix.start }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Wait for ${{ matrix.server }}
        env:
          READY: ${{ matrix.ready }}
        run: timeout 300 bash -c 'until eval "$READY"; do sleep 5; done'

      - name: Run engine query and mutation contracts
        env:
          ENGINE_PROBE_DATABASE_URL: ${{ matrix.url }}
        run: cargo test --locked --no-default-features --features sqlite,${{ matrix.feature }},runtime-tokio --tests 'live::'

      - name: Server log
        if: failure()
        run: docker logs --tail 200 db
